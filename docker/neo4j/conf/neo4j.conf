# neo4j.conf — Configurazione custom Neo4j (montata in /conf nel container)
# Solo i valori che sovrascrivono i default dell'immagine Docker ufficiale.
# La maggior parte dei parametri viene passata come variabili d'ambiente
# nel docker-compose.yml (hanno precedenza su questo file).

# ── Sicurezza ──────────────────────────────────────────────────────────────
# Permetti procedure APOC senza whitelist esplicita
dbms.security.procedures.unrestricted=apoc.*
dbms.security.procedures.allowlist=apoc.*

# ── Query ──────────────────────────────────────────────────────────────────
# Timeout query (ms) — evita query che bloccano il DB
dbms.transaction.timeout=120s

# ── Transazioni ────────────────────────────────────────────────────────────
# Numero massimo di transazioni concorrenti
dbms.transaction.concurrent.maximum=100

# ── Log query lente (utile in sviluppo) ────────────────────────────────────
# Logga query che impiegano più di 1 secondo
dbms.logs.query.enabled=INFO
dbms.logs.query.threshold=1000ms
dbms.logs.query.parameter_logging_enabled=true
